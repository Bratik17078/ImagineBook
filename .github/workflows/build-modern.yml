name: Build Minecraft 26.x

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: modern
        run: bash ./gradlew :${{ matrix.minecraft }}-${{ matrix.loader }}:build
      - name: Verify mixins
        if: matrix.loader == 'fabric'
        working-directory: modern
        run: bash ./gradlew :${{ matrix.minecraft }}-fabric:runMixinSmoke -x downloadAssets
      - uses: actions/upload-artifact@v4
        with:
          name: imaginebook-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            modern/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*.jar
            !modern/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*-smoke-test.jar
