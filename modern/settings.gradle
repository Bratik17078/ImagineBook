pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'ImagineBook-modern'
['26.2', '26.3'].each { mc ->
    ['fabric', 'neoforge'].each { loader ->
        include("${mc}-${loader}")
    }
}
